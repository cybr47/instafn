name: Build Firefox Extension

on:
  push:
    branches: [firefox-port]
  workflow_dispatch:

jobs:
  build-firefox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox version
        run: npm run build:firefox

      - name: Create Firefox package
        run: |
          cd dist
          zip -r ../instafn-firefox.xpi .
          cd ..

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: instafn-firefox
          path: instafn-firefox.xpi
          retention-days: 90
